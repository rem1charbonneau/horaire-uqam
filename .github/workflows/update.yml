name: Mettre à jour les horaires et publier le site

on:
  schedule:
    - cron: '17 5 * * 0'   # lecture complète une fois par semaine (dimanche) ; le reste est piloté par l'ordonnanceur du relais
  workflow_dispatch:
    inputs:
      courses:
        description: 'Sigles à relire (séparés par des espaces). Vide = tous les cours de la liste.'
        required: false
        default: ''
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Sur un simple push (changement de design), on ne relit pas l'UQAM : on réutilise les dernières données.
      - name: Garder le navigateur en cache
        if: github.event_name != 'push'
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
      - name: Installer Playwright
        if: github.event_name != 'push'
        run: |
          npm install
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Reprendre les dernières données publiées (repli si une lecture échoue)
        run: |
          mkdir -p site
          curl -fsS -H "Cache-Control: no-cache" "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json?t=$(date +%s)" -o site/data.json || cp data.json site/data.json
          curl -fsS -H "Cache-Control: no-cache" "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/catalogue.json?t=$(date +%s)" -o site/catalogue.json || rm -f site/catalogue.json
      - name: Lire le site de l'UQAM (une page à la fois, avec pause)
        if: github.event_name != 'push'
        env:
          ONLY: ${{ github.event.inputs.courses }}
        run: |
          # Cours demandés à la main (actualisation rapide) : on les lit et on note la date de la demande.
          LIST=$(printf '%s' "$ONLY" | tr -c 'A-Z0-9:' ' ' | tr -s ' ' | grep -oE '[A-Z]{3}[0-9]{3}[0-9A-Z](:[0-9]{4})?' | head -12 | tr '\n' ' ')
          if [ -n "$LIST" ]; then
            export ASKED=1
          else
            # Lecture automatique (toutes les heures) : seulement les cours demandés dans les 7 derniers jours.
            # Une lecture complète de la liste a lieu une fois par semaine (dimanche, 5 h UTC) ou si le fichier est vide.
            LIST=$(node -e "const d=require('./site/data.json');const t=Date.now()-7*864e5;console.log(Object.keys(d).filter(k=>d[k].asked>t).slice(0,40).join(' '))")
            if [ "$(date -u +%u%H)" = "705" ] || [ "$(node -e "console.log(Object.keys(require('./site/data.json')).length)")" -lt 5 ]; then
              LIST=$(cat courses.txt | tr '\n' ' ')
            fi
          fi
          if [ -z "$LIST" ]; then echo "Aucun cours demandé récemment : pas de lecture."; exit 0; fi
          echo "Cours lus : $LIST"
          node scrape.js site/data.json 7111 $LIST
      - name: Assembler le site
        run: |
          cp index.html site/index.html
          cp structure.json site/structure.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
