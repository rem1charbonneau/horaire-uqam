name: Lire le catalogue des cours (crédits et préalables)

on:
  workflow_dispatch:
  schedule:
    - cron: '41 6 * * 0'   # une fois par semaine (dimanche)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  lire:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install
          # Réessaie en cas de panne réseau passagère (apt qui ne trouve pas les serveurs Ubuntu)
          for i in 1 2 3; do npx playwright install --with-deps chromium && break; [ $i = 3 ] && exit 1; echo "Échec, nouvel essai dans 30 s"; sleep 30; done
      - name: Reprendre les fichiers déjà publiés
        run: |
          mkdir -p site
          B="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          curl -fsS -H "Cache-Control: no-cache" "$B/data.json?t=$(date +%s)" -o site/data.json || cp data.json site/data.json
          curl -fsS -H "Cache-Control: no-cache" "$B/catalogue.json?t=$(date +%s)" -o site/catalogue.json || echo '{}' > site/catalogue.json
      - name: Lire les fiches de cours (deux à la fois, avec pause)
        run: node scrape-catalog.js site/catalogue.json structure.json
      - run: cp index.html site/index.html
      - run: |
          cp structure.json site/structure.json
          [ -f grilles.json ] && cp grilles.json site/grilles.json || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publier:
    needs: lire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
