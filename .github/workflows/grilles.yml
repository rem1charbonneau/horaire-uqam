name: Lire les grilles de cheminement (fiches officielles)

on:
  workflow_dispatch:
    inputs:
      codes:
        description: "Codes de programmes (vide = tous), séparés par des espaces"
        required: false
        default: ''
      raw:
        description: "Conserver le HTML brut (diagnostic)"
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  lire:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Lire les grilles
        run: |
          F=""; [ "${{ inputs.raw }}" = "true" ] && F="--raw"
          node scrape-grids.js programmes.json grilles.json $F ${{ inputs.codes }}
      - name: Déposer le résultat sur la branche grilles-out
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          cp grilles.json /tmp/grilles.json
          git checkout --orphan grilles-out
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/grilles.json grilles.json
          git add -f grilles.json
          git commit -m "grilles.json" 
          git push -f origin grilles-out
