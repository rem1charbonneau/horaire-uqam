<!doctype html>
<html lang="fr"><head>
<title>Horaire UQAM Hiver 2027</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Disposition : colonne de réglages à gauche (4 sections repliables), résultats à droite avec navigation d'un horaire à l'autre. */
:root{
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-head:"Inter",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#EAF3FB; --surface:#FFFFFF; --surface-2:#F3F8FD; --ink:#0F2236; --muted:#52687D; --line:#D3E2F0;
  --accent:#0A6CC2; --accent-2:#3AA0E8; --accent-soft:#DCEEFC; --accent-ink:#FFFFFF; --shadow:0 1px 2px rgba(10,60,110,.06),0 6px 18px rgba(10,60,110,.07);
  --ok:#17794A; --ok-bg:#DDF2E6; --warn:#955700; --warn-bg:#FCEBC8; --bad:#B3261E; --bad-bg:#FADDDA;
  --work:#6B7587; --work-bg:#DDE2EA;
  --c1:#2B64D9; --c1t:#E2EBFC; --c2:#0F8577; --c2t:#D9F1ED; --c3:#A8660A; --c3t:#FBEBD0; --c4:#7A4BC9; --c4t:#EBE2FA; --c5:#C03A5B; --c5t:#FADFE6;
  --c6:#4C8B1F; --c6t:#E6F2D8; --c7:#0B7FA6; --c7t:#D8EEF6; --c8:#8A6D00; --c8t:#F3EBC4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1522; --surface:#10202F; --surface-2:#142637; --ink:#E6F0FA; --muted:#93A9BE; --line:#223A50;
    --accent:#4DB0F5; --accent-2:#2E8FD8; --accent-soft:#12324B; --accent-ink:#06192A; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    --ok:#5FD395; --ok-bg:#123525; --warn:#F0B14F; --warn-bg:#3A2A0C; --bad:#FF8A80; --bad-bg:#3E1713;
    --work:#8D98AB; --work-bg:#252E3B;
    --c1:#7BA3FF; --c1t:#17284A; --c2:#4FD1BF; --c2t:#0F3330; --c3:#F2B35A; --c3t:#392A10; --c4:#B79BFF; --c4t:#2A1F4A; --c5:#FF8FA9; --c5t:#451C28;
    --c6:#8FD05A; --c6t:#1F3318; --c7:#5CC3EA; --c7t:#123241; --c8:#E0C45A; --c8t:#3A3210;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1522; --surface:#10202F; --surface-2:#142637; --ink:#E6F0FA; --muted:#93A9BE; --line:#223A50;
  --accent:#4DB0F5; --accent-2:#2E8FD8; --accent-soft:#12324B; --accent-ink:#06192A; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --ok:#5FD395; --ok-bg:#123525; --warn:#F0B14F; --warn-bg:#3A2A0C; --bad:#FF8A80; --bad-bg:#3E1713;
  --work:#8D98AB; --work-bg:#252E3B;
  --c1:#7BA3FF; --c1t:#17284A; --c2:#4FD1BF; --c2t:#0F3330; --c3:#F2B35A; --c3t:#392A10; --c4:#B79BFF; --c4t:#2A1F4A; --c5:#FF8FA9; --c5t:#451C28;
  --c6:#8FD05A; --c6t:#1F3318; --c7:#5CC3EA; --c7t:#123241; --c8:#E0C45A; --c8t:#3A3210;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:0.875rem;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1380px;margin:0 auto}
.top{padding:20px 0 14px}
.top h1{margin:0;font:600 1.75rem/1.1 var(--font-head);letter-spacing:.01em;text-wrap:balance}
.top p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:1000px){
  .cols{grid-template-columns:minmax(340px,420px) minmax(0,1fr);align-items:start}
  .left{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);overflow:auto;padding-right:4px}
}
.left,.right{min-width:0;display:flex;flex-direction:column;gap:10px}
.left>*,.right>*{flex-shrink:0}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.sec>summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:8px;font:600 0.9375rem var(--font-head);letter-spacing:.04em;text-transform:uppercase}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .12s}
.sec[open]>summary::before{transform:rotate(45deg)}
.sec>summary small{margin-left:auto;font:400 0.75rem var(--font-body);text-transform:none;letter-spacing:0;color:var(--muted);text-align:right}
.sec-b{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px}
.lab{font:500 0.6875rem var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:2px 0 -4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:3px 11px;font-size:0.8125rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.row label,label.chk{display:flex;gap:6px;align-items:center;font-size:0.8125rem}
input[type=number],input[type=time],select{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:4px 7px}
input[type=number]{width:64px;font-family:var(--font-mono)}
input[type=time]{font-family:var(--font-mono)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.hint{font-size:0.75rem;color:var(--muted);margin:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:0.8125rem}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:2px 8px;font-size:0.75rem}
.days{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px 8px;align-items:center;font-size:0.8125rem}
.days .dn{display:flex;gap:6px;align-items:center;min-width:56px}
.days.off input[type=time]{opacity:.4}
.crs{border:1px solid var(--line);border-left:5px solid var(--cc);border-radius:8px;background:var(--surface-2)}
.crs-h{display:flex;gap:8px;align-items:center;padding:8px 10px}
.crs-h label{display:flex;gap:8px;align-items:center;flex:1;min-width:0;cursor:pointer}
.crs-h code{font:500 0.8125rem var(--font-mono);color:var(--cc)}
.crs-h .ti{font-size:0.7812rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crs-h .n{font:400 0.75rem var(--font-mono);color:var(--muted);white-space:nowrap}
.crs details>summary{list-style:none;cursor:pointer;padding:5px 10px;border-top:1px solid var(--line);font-size:0.75rem;color:var(--accent)}
.crs details>summary::-webkit-details-marker{display:none}
.grp{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:4px 8px;align-items:start;padding:7px 10px;border-top:1px solid var(--line);background:var(--surface)}
.grp.no{opacity:.55}
.grp.pinned{box-shadow:inset 3px 0 0 var(--accent)}
.grp .w{font:500 0.7812rem var(--font-mono)}
.grp .w i{display:block;font-style:normal;font-weight:400;font-size:0.7188rem;color:var(--muted)}
.grp .m{display:flex;flex-wrap:wrap;gap:3px 8px;align-items:center;margin-top:2px;font-size:0.75rem}
.grp .id{font:500 0.6875rem var(--font-mono);color:var(--muted)}
.tag{font-size:0.6875rem;border-radius:4px;padding:1px 6px;background:var(--surface-2);border:1px solid var(--line)}
.tag.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.tag.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.mode{display:inline-flex;align-items:center;gap:5px;font-size:0.7188rem;font-weight:500;border:1px solid var(--line);border-radius:999px;padding:0 8px 0 6px}
.seats{font:500 0.75rem var(--font-mono);padding:2px 7px;border-radius:5px;white-space:nowrap}
.seats.ok{background:var(--ok-bg);color:var(--ok)}
.seats.low{background:var(--warn-bg);color:var(--warn)}
.seats.zero{background:var(--bad-bg);color:var(--bad)}
.shift{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.shift .x{border:none;background:none;color:var(--muted);font-size:1.125rem;padding:0 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.rhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.count{font:600 1.625rem/1 var(--font-head)}
.count small{display:block;font:400 0.75rem var(--font-body);color:var(--muted);margin-top:3px}
.pgr{display:flex;gap:6px;align-items:center}
.pgr .pos{font:500 0.875rem var(--font-mono);min-width:96px;text-align:center}
.pgr .btn{min-width:38px;font-size:1rem;padding:4px 10px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:12px}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 6px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:0.75rem;color:var(--muted)}
.stat b{color:var(--ink);font-weight:600}
.wkwrap{overflow-x:auto;margin-top:8px}
.wk{display:grid;grid-template-columns:38px repeat(6,minmax(92px,1fr));min-width:640px}
.wk-head{font:600 0.75rem var(--font-head);letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:4px 0 6px;color:var(--muted)}
.wk-time{position:relative;font:400 0.6562rem var(--font-mono);color:var(--muted)}
.wk-time span{position:absolute;right:6px;transform:translateY(-50%)}
.wk-col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 47px,var(--line) 47px,var(--line) 48px)}
.blk{position:absolute;border-radius:6px;border:1px solid var(--cc);border-left:4px solid var(--cc);background:var(--ct);padding:3px 5px;font-size:0.6875rem;line-height:1.28;overflow:hidden;z-index:2}
.blk b{font:500 0.7188rem var(--font-mono)}
.blk .t{font:400 0.6875rem var(--font-mono)}
.blk.bad{outline:2px solid var(--bad);z-index:4}
.work{position:absolute;left:2px;right:2px;border:1px solid var(--work);border-radius:6px;background-image:repeating-linear-gradient(45deg,var(--work-bg) 0 6px,transparent 6px 12px);color:var(--muted);font-size:0.6875rem;padding:3px 5px;z-index:1}
.buf{position:absolute;left:2px;right:2px;background:var(--work-bg);opacity:.45;border-radius:4px;z-index:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:0.75rem;color:var(--muted);margin-top:10px;align-items:center}
.c1{--cc:var(--c1);--ct:var(--c1t)}.c2{--cc:var(--c2);--ct:var(--c2t)}.c3{--cc:var(--c3);--ct:var(--c3t)}.c4{--cc:var(--c4);--ct:var(--c4t)}.c5{--cc:var(--c5);--ct:var(--c5t)}.c6{--cc:var(--c6);--ct:var(--c6t)}.c7{--cc:var(--c7);--ct:var(--c7t)}.c8{--cc:var(--c8);--ct:var(--c8t)}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:0.7812rem}
th,td{text-align:left;padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
th{font:500 0.6875rem var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:none}
td.m{font-family:var(--font-mono)}
td.cd{font:500 0.7812rem var(--font-mono);color:var(--cc)}
.alert{border-radius:8px;padding:8px 11px;font-size:0.8125rem}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.ok{background:var(--ok-bg);color:var(--ok)}
.alert+.alert{margin-top:6px}
.favs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.favs .chip b{font-family:var(--font-mono);font-weight:500}
.h3{margin:0 0 8px;font:600 0.9375rem var(--font-head);letter-spacing:.04em;text-transform:uppercase}
.foot{margin-top:22px;font-size:0.75rem;color:var(--muted);max-width:90ch}
.foot a{color:var(--accent)}
details.plain>summary{cursor:pointer;font:600 0.9375rem var(--font-head);letter-spacing:.04em;text-transform:uppercase}
details.plain[open]>summary{margin-bottom:10px}

.top{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:flex-end;justify-content:space-between}
.top .meta{font-size:0.7812rem;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:flex-end;text-align:right}
.top .meta.stale b{color:var(--warn)}
.refresh{margin-bottom:14px}
.refresh textarea{width:100%;min-height:74px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px;font:13px/1.4 var(--font-mono);resize:vertical;color:var(--ink)}
.cat-wrap{margin-bottom:14px}
.cat table{min-width:640px}
.cat tr.blk-h td{background:var(--surface-2);font:600 0.75rem var(--font-head);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line)}
.cat tr.sel td{background:var(--ct)}
.cat tr.off td{opacity:.5}
.cat td.pre{font-size:0.75rem;color:var(--muted);max-width:260px}
.cat td.pre.warn{color:var(--warn)}
.cat .cr{font:400 0.7188rem var(--font-mono);color:var(--muted)}
.cat-sum{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:0 0 10px}
.done{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:10px;font-size:0.8125rem}
.done input[type=text]{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:4px 7px;min-width:220px;font:13px var(--font-mono);color:var(--ink)}
.crs-h .btn.sm{flex-shrink:0}
.crs .pw{padding:0 10px 8px}

.tri{border:1px solid var(--line);border-radius:10px;background:var(--surface-2);overflow:hidden}
.tri-h{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:0.7812rem;color:var(--muted)}
.tri-h b{font:600 0.8125rem var(--font-head);letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.tri-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;padding:8px;align-items:start}
.gc{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:5px;min-width:0}
.gc.sel{border-left-color:var(--cc);background:var(--ct)}
.gc.done{opacity:.6}
.gc.off{opacity:.5}
.phl{border-top:1px dashed var(--line);padding:8px 14px 12px;max-height:440px;overflow:auto}
.ph.sub{font-weight:500;color:var(--muted);margin:12px 0 2px}
.gc.ph{align-self:start;gap:4px;border-style:dashed;color:var(--muted);align-items:flex-start}
.gc.grp-par{gap:6px}
.gc .gc{border-left-width:3px;box-shadow:none}
.gc .gh{display:flex;justify-content:space-between;gap:6px;align-items:center}
.gc .gt{font-size:0.7812rem;line-height:1.3}
.gc .gm{font-size:0.75rem;color:var(--muted);display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.gc .cd{font:500 0.8125rem var(--font-mono)}
.gc .chk.fait{font-size:0.75rem;color:var(--muted)}
.tag.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.cr{font:400 0.7188rem var(--font-mono);color:var(--muted)}
.cat .tblwrap table{min-width:720px}

/* ===== Habillage UQAM : bleu clair, cartes douces, animations discrètes ===== */
body{background:var(--bg);background-image:radial-gradient(1200px 380px at 50% -120px,var(--accent-soft),transparent 70%);background-repeat:no-repeat}
.app{padding-top:14px}
.top{position:relative;overflow:hidden;margin:6px 0 18px;padding:22px 26px;border-radius:18px;color:#fff;
  background:linear-gradient(120deg,#0A5CA8 0%,#0A6CC2 45%,#3AA0E8 100%);box-shadow:var(--shadow);animation:rise .5s ease both}
.top::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.12)}
.top::before{content:"";position:absolute;right:120px;bottom:-110px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
.top>*{position:relative;z-index:1}
.top h1{font:700 1.875rem/1.1 var(--font-head);letter-spacing:-.02em}
.top p,.top .meta{color:rgba(255,255,255,.88)}
.top .meta.stale b{color:#FFE3A3}
.sec,.card,.tri,.crs{border-radius:14px;box-shadow:var(--shadow);transition:box-shadow .2s ease,border-color .2s ease}
.sec>summary,.h3,details.plain>summary{letter-spacing:.02em;text-transform:none;font:600 0.9375rem var(--font-head)}
.sec>summary{padding:13px 16px;transition:background .15s}
.sec>summary:hover{background:var(--surface-2);border-radius:14px}
.sec[open]>summary::before{border-color:var(--accent)}
.sec-b{animation:fade .25s ease both}
.btn{border-radius:10px;padding:7px 14px;font-weight:500;transition:transform .12s ease,box-shadow .15s ease,border-color .15s ease,background .15s ease}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 12px rgba(10,108,194,.18)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent}
.chip{padding:4px 12px;transition:background .15s,color .15s,border-color .15s,transform .12s}
.chip:hover{border-color:var(--accent);transform:translateY(-1px)}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent}
input[type=number],input[type=time],select{border-radius:8px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.crs{border-left-width:5px;overflow:hidden;animation:rise .35s ease both}
.crs:hover{box-shadow:0 2px 4px rgba(10,60,110,.08),0 10px 24px rgba(10,60,110,.1)}
.grp{transition:background .15s}
.grp:hover{background:var(--surface-2)}
.gc{border-radius:12px;transition:transform .15s ease,box-shadow .15s ease,background .2s ease,border-color .2s;animation:rise .35s ease both}
.gc:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tri-h{background:linear-gradient(90deg,var(--accent-soft),transparent)}
.cat tr{transition:background .15s}
.cat tr:not(.blk-h):hover td{background:var(--accent-soft)}
.count{font:700 1.875rem/1 var(--font-head);color:var(--accent);letter-spacing:-.02em}
.stat{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.wk-col{background-color:var(--surface)}
.blk{border-radius:8px;box-shadow:0 1px 3px rgba(10,60,110,.15);animation:pop .3s cubic-bezier(.2,.8,.3,1.2) both;transition:transform .15s ease,box-shadow .15s ease}
.blk:hover{transform:scale(1.03);z-index:5;box-shadow:0 6px 16px rgba(10,60,110,.25)}
.wkwrap{animation:fade .3s ease both}
.seats{border-radius:999px}
.tag{border-radius:999px}
.alert{border-radius:12px;animation:fade .25s ease both}
.pgr .pos{color:var(--accent)}
.foot a{color:var(--accent);text-underline-offset:3px}
.left::-webkit-scrollbar,.wkwrap::-webkit-scrollbar{width:8px;height:8px}
.left::-webkit-scrollbar-thumb,.wkwrap::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

/* Modalités : même apparence dans la légende et dans l'horaire.
   Présentiel = plein · Hybride = moitié pleine · À distance = contour pointillé, fond vide */

/* Modalités : trois niveaux de remplissage faciles à distinguer, identiques dans la légende et l'horaire

:root{--on:#FFFFFF}

function stats(gs){

var lastPruned=[],lastPrunedDone=[];
function prune(){
  lastPrunedDone=[];
  var again=true;
  while(again){again=false;
    S.done.slice().forEach(function(code){var c=course(code);if(c&&preUnmet(c)){S.done.splice(S.done.indexOf(code),1);lastPrunedDone.push(code);again=true;}});}
  var rm=S.sel.filter(function(code){var c=course(code);return isDone(code)||(c&&preUnmet(c));});
  lastPruned=rm.filter(function(code){return !isDone(code);});
  if(rm.length||lastPrunedDone.length){S.sel=S.sel.filter(function(c){return rm.indexOf(c)<0;});save();}
}

function diffData(a,b){
  var out=[];
  Object.keys(b).forEach(function(k){
    var n=b[k],o=a&&a[k];if(!n||typeof n!=='object')return;
    if(!o){out.push({code:k,t:'Cours ajouté aux données'});return;}
    var og={},ng={};(o.groups||[]).forEach(function(g){og[g.id]=g;});(n.groups||[]).forEach(function(g){ng[g.id]=g;});
    Object.keys(ng).forEach(function(id){
      var x=og[id],y=ng[id];
      if(!x){out.push({code:k,t:'Nouveau groupe '+id+' ('+y.places+' place'+(y.places>1?'s':'')+')'});return;}
      if(x.places!==y.places){
        if(y.places===0)out.push({code:k,t:'Groupe '+id+' maintenant complet (avant : '+x.places+')',k:'bad'});
        else if(x.places===0)out.push({code:k,t:'Groupe '+id+' : une place s’est libérée ('+y.places+')',k:'ok'});
        else out.push({code:k,t:'Groupe '+id+' : '+x.places+' → '+y.places+' places',k:y.places<x.places?'warn':'ok'});
      }
      if(JSON.stringify(x.slots)!==JSON.stringify(y.slots))out.push({code:k,t:'Groupe '+id+' : horaire ou lieu modifié',k:'warn'});
      else if(JSON.stringify(x.exams)!==JSON.stringify(y.exams))out.push({code:k,t:'Groupe '+id+' : dates d’examen modifiées',k:'warn'});
    });
    Object.keys(og).forEach(function(id){if(!ng[id])out.push({code:k,t:'Groupe '+id+' retiré',k:'bad'});});
    if((o.prereq||'')!==(n.prereq||'')&&(o.prereq||n.prereq))out.push({code:k,t:'Préalables modifiés',k:'warn'});
  });
  return out;
}

function waitFresh(before,since,mins){
  clearInterval(upd.timer);
  var t0=since||Date.now(),est=t0+(mins===1?70:(mins||7)*60)*1000;
  try{localStorage.setItem(RKEY,JSON.stringify({t0:t0,before:before,mins:mins}));}catch(e){}

  function say(st){upd.msg=(st==='queued'?'Lecture en attente':'Lecture de l’UQAM en cours')+' · fin prévue vers '+hm(Math.max(est,Date.now()+30000));paintStamp();}
  say('in_progress');
  var n=0;
  function tick(){
    if(Date.now()-t0>16*60*1000){forget();stopPoll();toast('La lecture prend plus de temps que prévu. Réessaie dans quelques minutes.');return;}
    n++;
    fetch('data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
      var f=newestOf(d);

      else if(n%2===1)runInfo().then(function(r){
        if(r&&r.status==='completed'&&r.conclusion&&r.conclusion!=='success'&&Date.now()-t0>60000){forget();stopPoll();toast('La lecture a échoué. Les anciennes données sont conservées.');}
        else if(r)say(r.status);
      }).catch(function(){});
    }).catch(function(){});
  }
  upd.timer=setInterval(tick,(mins&&mins<=2)?8000:20000);
}

function resumeRun(){
  var o=null;try{o=JSON.parse(localStorage.getItem(RKEY)||'null');}catch(e){}
  if(o&&Date.now()-o.t0<16*60*1000){if(!upd.timer)waitFresh(o.before,o.t0,o.mins);return;}
  forget();

    if(r&&r.status!=='completed'&&!upd.timer){var t=new Date(r.run_started_at||r.created_at).getTime();if(Date.now()-t<16*60*1000)waitFresh(newest(),t);}

// Mise à jour automatique : vérifie en arrière-plan, remplace les données sans recharger la page
function quietBusy(){var a=document.activeElement;return (a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))||!!document.querySelector('.tf-pop');}
function autoCheck(){
  if(document.hidden||upd.timer)return;
  fetch('data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(d){
    if(!d)return;var f=newestOf(d),cur=newest();
    if(f&&cur&&f>cur){
      if(quietBusy()){setTimeout(autoCheck,15000);return;}
      applyData(d,'Nouvelles données chargées.');
    }
  }).catch(function(){});
}

function validate(){
  if(valState.sending)return;
  var codes=valKey().split(' ').filter(Boolean).slice(0,20);if(!codes.length)return;
  valState.sending=true;valState.err='';document.body.classList.add('sending');render();
  function fail(m){valState.sending=false;valState.err=m;document.body.classList.remove('sending');render();}
  fetch(RELAY+'request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({courses:codes,programs:S.pOf})})
    .then(function(r){return r.json().then(function(j){return {s:r.status,j:j};});})
    .then(function(x){
      if(x.s!==200||x.j.status!=='queued'){fail('L’envoi a échoué ('+x.s+'). Tes choix sont gardés, réessaie.');return;}
      S.sent=codes.join(' ');save();valState.sending=false;valState.err='';document.body.classList.remove('sending');
      goTab('generateur');render();window.scrollTo(0,0);
      var old=codes.filter(function(c){var r=DATA[c];return !r||!r.fetched||Date.now()-new Date(r.fetched).getTime()>10*60000;}).length;
      toast(old?old+' cours demandé'+(old>1?'s':'')+' : mise à jour en cours, les places seront rafraîchies sous peu.':'Tes cours sont à jour (lus il y a moins de 10 min).');
      var n=0;clearInterval(window.__fc);window.__fc=setInterval(function(){autoCheck();if(++n>=15)clearInterval(window.__fc);},20000);
    }).catch(function(){fail('Impossible de joindre le serveur. Tes choix sont gardés, réessaie.');});
}
function doUpdate(){
  if(upd.busy)return;
  upd.busy=true;upd.msg='Actualisation…';paintStamp();
  var before=newest(),tok=getTok(),last=0;
  try{last=+localStorage.getItem(LKEY)||0;}catch(e){}
  var recent=Date.now()-last<15*60*1000;
  function plain(note){
    reloadData().then(function(){var changed=newest()!==before;stopPoll();toast((changed?'Nouvelles données chargées. ':'Déjà à jour. ')+(note||''));})
      .catch(function(){stopPoll();toast('Impossible de recharger les données.');});
  }
  if(RELAY){
    fetch(RELAY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({courses:S.sel.slice(0,12)})}).then(function(r){return r.json().then(function(j){return {s:r.status,j:j};});}).then(function(x){
      if(x.s!==200&&x.s!==202){stopPoll();toast('Échec du lancement ('+x.s+').');return;}
      if(x.j.status==='busy'){
        runInfo().then(function(r){
          if(r&&r.status!=='completed')waitFresh(before,new Date(r.run_started_at||r.created_at).getTime());
          else plain('Une lecture vient d’avoir lieu (il y a moins de 3 min).');
        }).catch(function(){plain('Une lecture est déjà en cours ou très récente.');});
        return;
      }
      waitFresh(before,undefined,S.sel.length?1:7);
    }).catch(function(){stopPoll();toast('Impossible de joindre le relais.');});
    return;
  }
  if(!tok){plain('Pour relire le site de l’UQAM maintenant, ajoute un jeton dans Paramètres.');return;}
  if(recent){plain('Une lecture a été lancée il y a moins de 15 min.');return;}
  fetch('https://api.github.com/repos/'+REPO+'/actions/workflows/update.yml/dispatches',{method:'POST',
    headers:{'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body:JSON.stringify({ref:'main'})})
  .then(function(r){
    if(r.status!==204){stopPoll();toast(r.status===401||r.status===403||r.status===404?'Jeton refusé : il lui faut la permission « Actions » en écriture sur ce dépôt.':'Échec du lancement ('+r.status+').');return;}
    try{localStorage.setItem(LKEY,String(Date.now()));}catch(e){}
    waitFresh(before);
  }).catch(function(){stopPoll();toast('Impossible de joindre GitHub.');});
}

//--- image de l'horaire (dessinée directement, sans bibliothèque)
function snapSchedule(){
  var sel=currentGroups();if(!sel.length){toast('Aucun horaire à enregistrer.');return;}
  var cs=getComputedStyle(document.documentElement);function V(n){return cs.getPropertyValue(n).trim();}
  var FB=getComputedStyle(document.body).fontFamily,FM=V('--font-mono')||'monospace';
  var Z=2,G=46,CW=150,HH=36,PXM=0.9,START=480,END=1320,PAD=14,H=(END-START)*PXM,W=G+6*CW,bufP=Number(S.bufP)||0;
  var cv=document.createElement('canvas');cv.width=(W+2*PAD)*Z;cv.height=(HH+H+2*PAD)*Z;
  var x=cv.getContext('2d');x.scale(Z,Z);x.translate(PAD,PAD);
  function rr(px,py,w,h,r){x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();}
  x.fillStyle=V('--surface');x.fillRect(-PAD,-PAD,W+2*PAD,HH+H+2*PAD);
  // cadre complet et en-tête
  rr(0,0,W,HH+H,12);x.save();x.clip();
  x.fillStyle=V('--surface-2');x.fillRect(0,0,W,HH);
  x.strokeStyle=V('--line');x.lineWidth=1;
  x.beginPath();x.moveTo(0,HH+.5);x.lineTo(W,HH+.5);x.stroke();
  for(var hr=8;hr<22;hr++){var y=HH+(hr-8)*60*PXM+.5;x.beginPath();x.moveTo(G,y);x.lineTo(W,y);x.stroke();}
  for(var i=0;i<6;i++){var cx=G+i*CW+.5;x.beginPath();x.moveTo(cx,0);x.lineTo(cx,HH+H);x.stroke();}
  x.restore();
  x.strokeStyle=V('--line');x.lineWidth=1.5;rr(0,0,W,HH+H,12);x.stroke();
  x.fillStyle=V('--muted');x.textAlign='center';x.textBaseline='middle';x.font='600 12px '+FB;
  DAYS.slice(0,6).forEach(function(d,i){x.fillText(d.toUpperCase(),G+i*CW+CW/2,HH/2);});
  x.textAlign='right';x.font='400 10.5px '+FM;
  for(hr=8;hr<22;hr++){x.fillText(hr+'h',G-8,HH+(hr-8)*60*PXM+(hr===8?8:0));}
  // motif hachuré du travail
  var pc=document.createElement('canvas');pc.width=pc.height=12;var pg=pc.getContext('2d');
  pg.strokeStyle=V('--work-bg');pg.lineWidth=5;pg.beginPath();pg.moveTo(-2,14);pg.lineTo(14,-2);pg.stroke();
  var pat=x.createPattern(pc,'repeat');
  function wrap(t,w){var words=t.split(' '),lines=[],cur='';words.forEach(function(wd){var tt=cur?cur+' '+wd:wd;if(x.measureText(tt).width>w&&cur){lines.push(cur);cur=wd;}else cur=tt;});if(cur)lines.push(cur);return lines;}
  DAYS.slice(0,6).forEach(function(d,di){
    var cx=G+di*CW,items=[];
    sel.forEach(function(o){o.g.slots.forEach(function(sl){if(sl.d===d)items.push({a:T(sl.s),b:T(sl.e),c:o.c,g:o.g,s:sl});});});
    lanes(items);
    S.work.forEach(function(w){if(w.d!==d)return;var ws=T(w.s),we=T(w.e);
      if(bufP>0){x.globalAlpha=.45;x.fillStyle=V('--work-bg');
        var b1=Math.max(START,ws-bufP);if(ws>b1)x.fillRect(cx+2,HH+(b1-START)*PXM,CW-4,(ws-b1)*PXM);
        var a2=Math.min(END,we+bufP);if(a2>we)x.fillRect(cx+2,HH+(we-START)*PXM,CW-4,(a2-we)*PXM);x.globalAlpha=1;}
      var t0=Math.max(START,ws),t1=Math.min(END,we);if(t1<=t0)return;
      var py=HH+(t0-START)*PXM,ph=(t1-t0)*PXM;
      rr(cx+2,py,CW-4,ph,6);x.fillStyle=V('--surface');x.fill();x.fillStyle=pat;x.fill();x.strokeStyle=V('--work');x.lineWidth=1;x.stroke();
      x.fillStyle=V('--muted');x.textAlign='left';x.textBaseline='top';x.font='500 11px '+FB;x.fillText('Indisponible',cx+8,py+5);x.fillText(w.s+'–'+w.e,cx+8,py+19);});
    items.forEach(function(it){
      var t0=Math.max(START,it.a),t1=Math.min(END,it.b);if(t1<=t0)return;
      var sl=it.s,ex=sl.t==='Exercices',n=(it.c.cls.match(/\d+/)||[1])[0],cc=V('--c'+n),ct=V('--c'+n+'t');
      var l3=ex?'Exercices · '+(sl.m==='dist'?'à distance':'en présentiel'):(it.g.mode==='dist'?'À distance':it.g.mode==='hyb'?('Hybride'+(it.g.campus?' · '+it.g.campus:'')):('Présentiel · '+campusLbl(it.g)));
      var bw=CW/it.n,bx=cx+it.lane*bw+2,by=HH+(t0-START)*PXM,bh=(t1-t0)*PXM,w2=bw-4;
      rr(bx,by,w2,bh,7);
      var pres=sl.m!=='dist'&&sl.m!=='hyb';
      x.fillStyle=pres?cc:(sl.m==='hyb'?ct:V('--surface'));x.fill();
      x.strokeStyle=cc;x.lineWidth=2;x.setLineDash(sl.m==='dist'?[5,3]:[]);x.stroke();x.setLineDash([]);
      x.save();rr(bx+1,by+1,w2-2,bh-2,6);x.clip();
      x.fillStyle=pres?V('--on'):V('--ink');x.textAlign='left';x.textBaseline='top';
      var ty=by+6,tx=bx+7,tw=w2-14;
      x.font='600 11.5px '+FM;x.fillText(it.c.code+' gr.'+it.g.id,tx,ty);ty+=15;
      x.font='400 11px '+FM;x.fillText(sl.s+'–'+sl.e,tx,ty);ty+=15;
      x.font='600 11px '+FB;wrap(l3,tw).forEach(function(L){x.fillText(L,tx,ty);ty+=14;});
      x.restore();});
  });
  cv.toBlob(function(bl){
    if(!bl){toast('Impossible de créer l’image.');return;}
    var a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='horaire-uqam-hiver-2027.png';
    document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
    toast('Image enregistrée.');
  },'image/png');
}

//--- champ d'heure : saisie au clavier + liste déroulante
function dayDD(attrs,val){
  return '<span class="tf tf-day"><input type="text" class="tf-in" data-list="days" readonly tabindex="-1" '+attrs+' value="'+val+'"><button type="button" class="tf-btn" data-tf aria-label="Choisir le jour" tabindex="-1"></button></span>';
}
function tf(attrs,val,empty){
  return '<span class="tf"><input type="text" class="tf-in" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="7" '+attrs+' value="'+(val||'')+'"'+(empty?' data-empty="1" placeholder="Aucune limite"':'')+'><button type="button" class="tf-btn" data-tf aria-label="Choisir dans la liste" tabindex="-1"></button></span>';
}
function parseTime(v){
  v=String(v).trim().toLowerCase().replace(/\s+/g,'');if(!v)return '';
  var pm=/p\.?m?\.?$/.test(v),am=/a\.?m?\.?$/.test(v);v=v.replace(/[ap]\.?m?\.?$/,'');
  var m=v.match(/^(\d{1,2})(?:[:h.]?(\d{2}))?h?$/);if(!m)return null;
  var h=+m[1],mi=m[2]?+m[2]:0;
  if(pm||am){if(h<1||h>12)return null;if(pm&&h<12)h+=12;if(am&&h===12)h=0;}
  if(h>23||mi>59)return null;
  return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0');
}
var tfPop=null;
function closePop(){if(tfPop){tfPop.remove();tfPop=null;}}
function openPop(inp){
  closePop();
  var box=inp.closest('.tf'),r=box.getBoundingClientRect(),h='';
  if(inp.dataset.list==='days'){DAYS.forEach(function(d){h+='<button type="button" class="tf-o'+(d===inp.value?' on':'')+'" data-v="'+d+'">'+(DAYS_LONG[DAYS.indexOf(d)].charAt(0).toUpperCase()+DAYS_LONG[DAYS.indexOf(d)].slice(1))+'</button>';});}
  else{
  if(inp.dataset.empty)h+='<button type="button" class="tf-o tf-none'+(inp.value===''?' on':'')+'" data-v="">Aucune limite</button>';
  var lo=inp.dataset.rng==='c'?480:300,hi=inp.dataset.rng==='c'?1320:1425;
  for(var m=lo;m<=hi;m+=15){var v=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');h+='<button type="button" class="tf-o'+(v===inp.value?' on':'')+'" data-v="'+v+'">'+v+'</button>';}
  }
  tfPop=document.createElement('div');tfPop.className='tf-pop';tfPop.innerHTML=h;tfPop._inp=inp;
  var w=Math.max(r.width,120);tfPop.style.width=w+'px';
  document.body.appendChild(tfPop);
  var ph=Math.min(tfPop.offsetHeight,248);
  var top=r.bottom+4;if(top+ph>window.innerHeight-8)top=Math.max(8,r.top-ph-4);
  tfPop.style.top=top+'px';tfPop.style.left=Math.max(8,Math.min(r.left,window.innerWidth-w-8))+'px';
  var on=tfPop.querySelector('.on')||tfPop.querySelector('[data-v="08:00"]');
  if(on)tfPop.scrollTop=Math.max(0,on.offsetTop-(tfPop.clientHeight-on.offsetHeight)/2);
}
function popCommit(v){var i2=tfPop._inp;closePop();i2.value=v;i2.dispatchEvent(new Event('change',{bubbles:true}));}
document.addEventListener('change',function(e){
  var t=e.target;if(!t.classList||!t.classList.contains('tf-in'))return;
  if(t.dataset.list==='days'){return;}
  var p=parseTime(t.value);
  if(p===null||(p===''&&!t.dataset.empty)){t.value=t.defaultValue;e.stopPropagation();return;}
  t.value=p;
},true);
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-tf]');
  if(b){var inp=b.parentNode.querySelector('.tf-in'),same=tfPop&&tfPop._inp===inp;closePop();if(!same)openPop(inp);return;}
  var o=e.target.closest('.tf-o');if(o&&tfPop){popCommit(o.getAttribute('data-v'));return;}
  if(!e.target.closest('.tf-pop'))closePop();
});
document.addEventListener('keydown',function(e){
  var t=e.target;
  if(e.key==='Escape')closePop();
  if(t.classList&&t.classList.contains('tf-in')){
    if(e.key==='Enter'){closePop();t.blur();}
    else if(e.key==='ArrowDown'){e.preventDefault();openPop(t);}
  }
});
window.addEventListener('resize',closePop);
window.addEventListener('scroll',function(e){if(tfPop&&!(e.target&&e.target.classList&&e.target.classList.contains('tf-pop')))closePop();},true);
